# Explicit promotion verification, not a notification for every Skillz push.
# Copy this self-contained file to OKHP3/skillz:
#   .github/workflows/verify-skill-landing.yml
#
# First merge the skill, then record its full accepted SHA in a promotion
# manifest on glee-fully-chai-chasers/main. That manifest push automatically
# runs the receiver's landing checks. Use this workflow for an explicit
# exact-commit verification or retry after the manifest is available.
# Ordinary maintenance commits are not new promotion records.
#
# VERIFY_LANDING_PAT must permit repository_dispatch to the incubator.
# A requested verification without that credential must fail, not claim success.
# The receiver still rejects an explicit SHA with no matching manifest.
name: Notify landing verification

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full accepted Skillz commit SHA already recorded in the incubator manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-verify:
    name: Dispatch landing verification to incubator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch repository_dispatch to glee-fully-chai-chasers
        shell: bash
        env:
          PROMOTION_SHA: ${{ inputs.commit_sha }}
          VERIFY_LANDING_PAT: ${{ secrets.VERIFY_LANDING_PAT }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          if [[ ! "${PROMOTION_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full lowercase 40-character Git commit SHA."
            exit 1
          fi
          if [[ -z "${VERIFY_LANDING_PAT:-}" ]]; then
            echo "::error::VERIFY_LANDING_PAT is not configured; requested verification was not dispatched."
            exit 1
          fi

          payload="$(node <<'NODE'
          const payload = {
            event_type: 'skillz-push',
            client_payload: {
              commit_sha: process.env.PROMOTION_SHA,
              ref: 'refs/heads/main',
              triggered_by: 'OKHP3/skillz explicit promotion verification',
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${VERIFY_LANDING_PAT}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/OKHP3/glee-fully-chai-chasers/dispatches"

          echo "Dispatched skillz-push for ${PROMOTION_SHA}; inspect the receiver run for the verification result."
