name: Test landing dispatch contract

on:
  pull_request:
    paths:
      - '.github/workflows/verify-skill-landing.yml'
      - '.github/workflows/test-landing-dispatch.yml'
      - 'scripts/test_landing_dispatch.py'
      - '.github/python-version'
      - '.github/node-version'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-skill-landing.yml'
      - '.github/workflows/test-landing-dispatch.yml'
      - 'scripts/test_landing_dispatch.py'
      - '.github/python-version'
      - '.github/node-version'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .github/python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/node-version
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/test_landing_dispatch.py -v
