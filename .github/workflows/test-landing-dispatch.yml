name: Test landing dispatch contract

on:
  pull_request:
    paths:
      - '.github/workflows/verify-skill-landing.yml'
      - '.github/workflows/test-landing-dispatch.yml'
      - 'scripts/test_landing_dispatch.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-skill-landing.yml'
      - '.github/workflows/test-landing-dispatch.yml'
      - 'scripts/test_landing_dispatch.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/test_landing_dispatch.py -v
