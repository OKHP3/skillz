name: Publish health check

# Confirms the live GitHub Pages site matches the commit built by the last
# successful deploy, on a schedule and immediately after every deploy-pages.yml run -- so a
# silently-failing or silently-stale publish surfaces on its own instead of
# requiring someone to manually check the Actions tab or the live site. A
# scheduled transient is debounced for three consecutive unhealthy runs;
# a failed deploy run alerts immediately.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows:
      - Deploy Skillz Forge to GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: publish-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PUBLISH_HEALTH_WEBHOOK_URL: ${{ secrets.PUBLISH_HEALTH_WEBHOOK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/node-version

      - name: Run publish health check
        id: health
        run: |
          mkdir -p validation-reports
          set +e
          node .agents/skills/publish-health-check/run.mjs --json validation-reports/publish-health-check.json
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Archive health check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-health-check-report
          path: validation-reports/publish-health-check.json
          if-no-files-found: ignore

      - name: Decide whether to alert
        id: alert
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEALTHY: ${{ steps.health.outputs.healthy }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          STATE_FILE: ${{ runner.temp }}/publish-health-state/streak.json
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/publish-health-state"
          mkdir -p "$state_dir"
          streak=0

          # Keep the scheduled failure count across workflow runs in a
          # replaceable artifact. The concurrency group serializes readers and
          # writers, so two scheduled checks cannot lose an increment.
          if artifacts=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts?name=publish-health-streak&per_page=1"); then
            archive_url=$(printf '%s' "$artifacts" | node -e "
              let data = '';
              process.stdin.on('data', c => data += c);
              process.stdin.on('end', () => {
                const artifact = JSON.parse(data).artifacts?.[0];
                console.log(artifact?.archive_download_url ?? '');
              });
            ")
          else
            echo "Could not read prior alert state; treating this as no prior streak."
            archive_url=''
          fi
          if [ -n "$archive_url" ]; then
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$archive_url" -o "$state_dir/streak.zip"; then
              unzip -oq "$state_dir/streak.zip" -d "$state_dir/downloaded"
              if [ -s "$state_dir/downloaded/streak.json" ]; then
                streak=$(node -e "
                  const fs = require('fs');
                  try {
                    const value = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).scheduledUnhealthyRuns;
                    process.stdout.write(Number.isInteger(value) && value >= 0 ? String(value) : '0');
                  } catch { process.stdout.write('0'); }
                " "$state_dir/downloaded/streak.json")
              fi
            fi
          fi
          PREVIOUS_STREAK="$streak" \
            node .agents/skills/publish-health-check/debounce.mjs

      - name: Archive alert state
        if: always() && steps.alert.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-health-streak
          path: ${{ runner.temp }}/publish-health-state/streak.json
          retention-days: 90
          overwrite: true

      - name: Reflect result in tracking issue
        id: incident
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEALTHY: ${{ steps.health.outputs.healthy }}
          ALERT_UNHEALTHY: ${{ steps.alert.outputs.alert }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"

          existing=$(curl -sS -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$API/issues?state=open&labels=publish-health&per_page=1")
          issue_number=$(echo "$existing" | node -e "
            let data = '';
            process.stdin.on('data', c => data += c);
            process.stdin.on('end', () => {
              const issues = JSON.parse(data);
              console.log(issues[0]?.number ?? '');
            });
          ")

          if [ "$HEALTHY" != "true" ] && [ "$ALERT_UNHEALTHY" = "true" ]; then
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            body=$(node -e "
              console.log(JSON.stringify({
                title: 'Skillz Forge publish is unhealthy',
                body: 'The publish-health-check workflow detected a problem with the live site.\n\nSee the run for the exact failure stage (workflow_failed, unreachable, or stale): $RUN_URL\n\nThis issue closes automatically once the check reports healthy again.',
                labels: ['publish-health'],
              }));
            ")
            if [ -n "$issue_number" ]; then
              curl -sS -X PATCH -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                "$API/issues/$issue_number" -d "$body" > /dev/null
              curl -sS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                "$API/issues/$issue_number/comments" \
                -d "$(node -e "console.log(JSON.stringify({ body: 'Still unhealthy: $RUN_URL' }))")" > /dev/null
              echo "Updated existing tracking issue #$issue_number"
            else
              curl -sS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                "$API/issues" -d "$body" > /dev/null
                echo "started=true" >> "$GITHUB_OUTPUT"
              echo "Opened a new tracking issue"
            fi
          elif [ "$HEALTHY" = "true" ]; then
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            if [ -n "$issue_number" ]; then
              curl -sS -X PATCH -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                "$API/issues/$issue_number" \
                -d "$(node -e "console.log(JSON.stringify({ state: 'closed' }))")" > /dev/null
              curl -sS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
                "$API/issues/$issue_number/comments" \
                -d "$(node -e "console.log(JSON.stringify({ body: 'Healthy again: $RUN_URL' }))")" > /dev/null
                echo "recovered=true" >> "$GITHUB_OUTPUT"
              echo "Closed tracking issue #$issue_number"
            else
              echo "Healthy; no tracking issue to close."
            fi
          else
            echo "Unhealthy reading held for debounce; no tracking issue action taken."
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send incident transition notification
        id: notification
        if: always() && (steps.incident.outputs.started == 'true' || steps.incident.outputs.recovered == 'true') && env.PUBLISH_HEALTH_WEBHOOK_URL != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STARTED: ${{ steps.incident.outputs.started }}
          RECOVERED: ${{ steps.incident.outputs.recovered }}
          NOTIFICATION_FAILURE_FILE: ${{ runner.temp }}/publish-health-webhook/failure.json
        run: |
          set -euo pipefail
          node .agents/skills/publish-health-check/send-notification.mjs

      - name: Record webhook delivery failure
        if: always() && steps.notification.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STARTED: ${{ steps.incident.outputs.started }}
          RECOVERED: ${{ steps.incident.outputs.recovered }}
          FAILURE_FILE: ${{ runner.temp }}/publish-health-webhook/failure.json
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          label="publish-health-webhook"
          delivery_event="recovered"
          if [ "$STARTED" = "true" ]; then
            delivery_event="unhealthy"
          fi

          # Keep delivery failures in a separate, durable issue. PUT makes the
          # label creation idempotent, so this works in repositories that do
          # not already have the label from a previous failure.
          curl -fsS -X PUT \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$API/labels/$label" \
            -d '{"name":"publish-health-webhook","color":"d73a4a","description":"Webhook delivery failures for publish-health alerts"}' \
            > /dev/null

          existing=$(curl -fsSL -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$API/issues?state=open&labels=$label&per_page=1")
          issue_number=$(echo "$existing" | node -e "
            let data = '';
            process.stdin.on('data', c => data += c);
            process.stdin.on('end', () => {
              const issues = JSON.parse(data);
              console.log(issues[0]?.number ?? '');
            });
          ")

          failure_details=$(node -e "
            const fs = require('fs');
            try {
              const record = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
              process.stdout.write(String(record.error || 'No delivery details were recorded.').slice(0, 300));
            } catch {
              process.stdout.write('No delivery details were recorded; see the workflow run.');
            }
          " "$FAILURE_FILE")
          body=$(
            DELIVERY_EVENT="$delivery_event" \
              FAILURE_DETAILS="$failure_details" \
              RUN_URL="$RUN_URL" \
              node <<'NODE'
          const event = process.env.DELIVERY_EVENT;
          const details = process.env.FAILURE_DETAILS;
          const runUrl = process.env.RUN_URL;
          process.stdout.write(JSON.stringify({
            title: 'Publish-health webhook delivery failure',
            body: [
              `The ${event} publish-health transition notification could not be delivered.`,
              '',
              `The publish-health incident is tracked separately and may recover independently. This delivery issue remains open until the webhook provider outage is investigated and resolved.`,
              '',
              `Failure details: ${details}`,
              `Workflow run: ${runUrl}`,
            ].join('\n'),
            labels: ['publish-health-webhook'],
          }));
          NODE
          )

          if [ -n "$issue_number" ]; then
            curl -fsS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "$API/issues/$issue_number/comments" \
              -d "$(DELIVERY_EVENT="$delivery_event" FAILURE_DETAILS="$failure_details" RUN_URL="$RUN_URL" node <<'NODE'
          const event = process.env.DELIVERY_EVENT;
          const details = process.env.FAILURE_DETAILS;
          const runUrl = process.env.RUN_URL;
          process.stdout.write(JSON.stringify({
            body: `Another ${event} publish-health notification failed.\n\nFailure details: ${details}\nWorkflow run: ${runUrl}`,
          }));
          NODE
              )" > /dev/null
            echo "Updated existing webhook delivery issue #$issue_number"
          else
            curl -fsS -X POST -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "$API/issues" -d "$body" > /dev/null
            echo "Opened webhook delivery issue"
          fi

      - name: Explain skipped incident notification
        if: always() && steps.incident.outputs.started != 'true' && steps.incident.outputs.recovered != 'true' && env.PUBLISH_HEALTH_WEBHOOK_URL == ''
        run: echo "No incident transition notification sent; PUBLISH_HEALTH_WEBHOOK_URL is not configured."

      - name: Fail the job if the publish is unhealthy
        if: always() && steps.health.outputs.healthy == 'false'
        run: |
          echo "Publish-health check failed; the underlying publish failure remains authoritative even if webhook delivery also failed."
          exit 1
