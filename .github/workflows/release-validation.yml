name: Validate Forge release

on:
  pull_request:
    paths:
      - "artifacts/forge/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/release-validation.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/forge/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/release-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-review-surface:
    name: Check Forge review surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser validation
        run: pnpm --filter @workspace/forge exec playwright install --with-deps chromium

      - name: Run Forge review-surface browser check
        run: pnpm --filter @workspace/forge run test:review-browser
