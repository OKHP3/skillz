name: Validate Forge release

on:
  pull_request:
    paths:
      - "artifacts/forge/**"
      - "artifacts/forge-review-desk/**"
      - "docs/archive/**"
      - "MIGRATION.md"
      - "**/*.md"
      - "LICENSE"
      - "scripts/verify-archive-links.mjs"
      - "scripts/verify-archive-links.test.mjs"
      - ".agents/skills/publish-health-check/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-health-check.yml"
      - ".github/workflows/release-validation.yml"
      - ".github/node-version"
      - "mermaid/okhp3-universe-map/**"
      - "universal/okhp3-repository-janitor/**"
      - "universal/okhp3-repo-settings/**"
      - "universal/okhp3-github-notification-maintainer/**"
  push:
    branches:
      - main
    paths:
      - "artifacts/forge/**"
      - "artifacts/forge-review-desk/**"
      - "docs/archive/**"
      - "MIGRATION.md"
      - "**/*.md"
      - "LICENSE"
      - "scripts/verify-archive-links.mjs"
      - "scripts/verify-archive-links.test.mjs"
      - ".agents/skills/publish-health-check/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-health-check.yml"
      - ".github/workflows/release-validation.yml"
      - ".github/node-version"
      - "mermaid/okhp3-universe-map/**"
      - "universal/okhp3-repository-janitor/**"
      - "universal/okhp3-repo-settings/**"
      - "universal/okhp3-github-notification-maintainer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-settings-contract:
    name: Check repository settings package and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .github/node-version
      - name: Validate portable package and Python safety checks
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12)'
          python3 -B -m unittest discover -s universal/okhp3-repo-settings/tests -v
          node .agents/skills/okhp3-skill-foundry/scripts/validate-skill-suite.cjs --root universal/okhp3-repo-settings
      - name: Build and test catalog contracts
        run: |
          node artifacts/forge/scripts/build-catalog.js
          node artifacts/forge/scripts/test-catalog.mjs

  universe-map-contract:
    name: Check universe-map skill contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .github/node-version
      - name: Validate package and generator regressions
        run: |
          node .agents/skills/okhp3-skill-foundry/scripts/validate-skill-suite.cjs --root mermaid/okhp3-universe-map
          python3 -B mermaid/okhp3-universe-map/tests/test-universe-map.py

  repository-maintenance-contracts:
    name: Check repository maintenance safety contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 9)'

      - name: Exercise temporary repository preservation and coverage
        run: python3 -m unittest discover -s universal/okhp3-repository-janitor/tests -v

      - name: Exercise offline GitHub inventory and incident gates
        run: python3 -m unittest discover -s universal/okhp3-github-notification-maintainer/tests -v

  archive-links:
    name: Check archived link integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/node-version

      - name: Verify archived README destinations
        run: node scripts/verify-archive-links.mjs

      - name: Exercise archive-link failure boundaries
        run: node --test scripts/verify-archive-links.test.mjs

  publish-health-debounce:
    name: Check publish-health debounce contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/node-version

      - name: Run publish-health debounce check
        run: node .agents/skills/publish-health-check/debounce-test.mjs

  forge-review-surface:
    name: Check Forge review surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for browser validation
        run: pnpm --filter @workspace/forge exec playwright install --with-deps chromium

      - name: Run Forge review-surface browser check
        run: pnpm --filter @workspace/forge run test:review-browser

  review-desk-surface:
    name: Check Review Desk surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Review Desk
        run: pnpm --filter @workspace/forge-review-desk run typecheck

      - name: Build Review Desk
        run: pnpm --filter @workspace/forge-review-desk run build
        env:
          PORT: "5183"
          BASE_PATH: "/forge-review-desk/"

      - name: Install Chromium for browser validation
        run: pnpm --filter @workspace/forge-review-desk exec playwright install --with-deps chromium

      - name: Run Review Desk browser check
        run: pnpm --filter @workspace/forge-review-desk run test:review-browser
