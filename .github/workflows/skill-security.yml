name: Skillz Shield security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Scan changed skill packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      scheduled_repeat: ${{ steps.attempted.outputs.cache-hit }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan package-only scope
        id: plan
        uses: OKHP3/skillz-shield@d23b33889707ef994ba78dadc8350d9a640633e0 # exact-content review policy (PR 29)
        with:
          mode: plan
          state: ${{ runner.temp }}/security-state
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Read the trusted plan scope
        id: scope
        shell: bash
        env:
          SECURITY_STATE: ${{ runner.temp }}/security-state
        run: |
          python -I - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['SECURITY_STATE']) / 'plan.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('full=' + str(plan['scope'] == 'full').lower() + '\n')
          PY

      - name: Resolve current stable vendors to immutable pins
        id: resolve
        if: steps.plan.outputs.scan == 'true'
        uses: OKHP3/skillz-shield@d23b33889707ef994ba78dadc8350d9a640633e0 # exact-content review policy (PR 29)
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: resolve
          state: ${{ runner.temp }}/security-state

      - name: Check for an earlier full-scan attempt this week
        id: attempted
        if: steps.plan.outputs.scan == 'true' && steps.scope.outputs.full == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/security-state/full-scan-attempt.json
          key: skill-security-v1-${{ steps.resolve.outputs.fingerprint }}-${{ steps.resolve.outputs.week }}
          lookup-only: true

      - name: Install the pinned vendor environments
        if: steps.plan.outputs.scan == 'true' && (github.event_name != 'schedule' || steps.attempted.outputs.cache-hit != 'true')
        uses: OKHP3/skillz-shield@d23b33889707ef994ba78dadc8350d9a640633e0 # exact-content review policy (PR 29)
        with:
          mode: install
          state: ${{ runner.temp }}/security-state

      - name: Scan selected packages
        id: scan
        if: steps.plan.outputs.scan == 'true' && (github.event_name != 'schedule' || steps.attempted.outputs.cache-hit != 'true')
        continue-on-error: true
        uses: OKHP3/skillz-shield@d23b33889707ef994ba78dadc8350d9a640633e0 # exact-content review policy (PR 29)
        with:
          mode: scan
          state: ${{ runner.temp }}/security-state

      - name: Record a terminal full-scan attempt, never a passing verdict
        id: mark
        if: always() && steps.scope.outputs.full == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (steps.scan.outputs.decision == 'pass' || steps.scan.outputs.decision == 'review-required' || steps.scan.outputs.decision == 'incomplete')
        shell: bash
        env:
          SECURITY_STATE: ${{ runner.temp }}/security-state
        run: |
          python -I - <<'PY'
          import json, os
          from pathlib import Path
          state = Path(os.environ['SECURITY_STATE'])
          report = json.loads((state / 'report.json').read_text())
          plan = json.loads((state / 'plan.json').read_text())
          assert report['scope'] == plan['scope'] == 'full'
          assert report['source_commit'] == plan['source_commit']
          assert report['expected_packages'] == len(plan['packages']) == len(report['packages'])
          assert report['decision'] in {'pass', 'review-required', 'incomplete'}
          marker = {'meaning': 'attempted-not-passed', 'source_commit': report['source_commit'],
                    'decision': report['decision'], 'complete': report['complete'],
                    'workflow_run_id': os.environ['GITHUB_RUN_ID']}
          (state / 'full-scan-attempt.json').write_text(json.dumps(marker) + '\n', encoding='utf-8')
          PY

      - name: Save only the trusted full-scan attempt marker
        if: always() && steps.mark.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/security-state/full-scan-attempt.json
          key: skill-security-v1-${{ steps.resolve.outputs.fingerprint }}-${{ steps.resolve.outputs.week }}

      - name: Explain a scheduled repeat skipped by the attempt marker
        if: github.event_name == 'schedule' && steps.attempted.outputs.cache-hit == 'true'
        shell: bash
        run: |
          printf '%s\n' '### Skill security: repeated full-scan attempt skipped' \
            'A full scan already produced a report for these vendor pins this week. This marker is not a passing verdict. Review the earlier run for findings or incomplete coverage; manual runs always rescan.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only sanitized security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-state/plan.json
            ${{ runner.temp }}/security-state/pins.json
            ${{ runner.temp }}/security-state/report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve the scanner failure result
        if: always() && steps.scan.outcome == 'failure'
        shell: bash
        run: exit 1

  review-policy:
    name: Skill package review policy
    needs: security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retrieve the unchanged scanner evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: skill-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-review

      - name: Confirm the selected package scope
        id: scope
        shell: bash
        env:
          SECURITY_STATE: ${{ runner.temp }}/security-review
          RAW_JOB_RESULT: ${{ needs.security.result }}
          SCHEDULED_REPEAT: ${{ needs.security.outputs.scheduled_repeat }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python -I - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['SECURITY_STATE']) / 'plan.json').read_text())
          packages = plan['packages']
          assert isinstance(packages, list)
          repeated = os.environ['EVENT_NAME'] == 'schedule' and os.environ['SCHEDULED_REPEAT'] == 'true'
          if not packages or repeated:
              assert os.environ['RAW_JOB_RESULT'] == 'success', 'No-package raw job did not succeed'
              print('Scheduled repeat skipped; earlier report remains the evidence.' if repeated
                    else 'No skill packages changed; no vendor scan was needed.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('scan=' + str(bool(packages) and not repeated).lower() + '\n')
          PY

      - name: Check exact reviewed scanner limitations
        if: steps.scope.outputs.scan == 'true'
        uses: OKHP3/skillz-shield@d23b33889707ef994ba78dadc8350d9a640633e0 # exact-content review policy (PR 29)
        with:
          mode: review
          state: ${{ runner.temp }}/security-review
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
